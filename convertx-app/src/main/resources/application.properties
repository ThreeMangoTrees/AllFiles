spring.application.name=FileOperationsXXX
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.port=${PORT:8081}
server.error.include-message=never
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
app.security.require-auth=${APP_SECURITY_REQUIRE_AUTH:true}
app.security.basic.username=${APP_BASIC_AUTH_USERNAME:fileoperationsxxx-admin}
app.security.basic.password=${APP_BASIC_AUTH_PASSWORD:}
app.security.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.requests-per-minute=${APP_RATE_LIMIT_REQUESTS_PER_MINUTE:30}
app.security.antivirus.enabled=${APP_ANTIVIRUS_ENABLED:false}
app.security.antivirus.command=${APP_ANTIVIRUS_COMMAND:clamscan}
